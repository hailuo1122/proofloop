services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Defaults to development so the stack boots without a token. For a real
      # deployment set NODE_ENV=production AND PROOFLOOP_API_TOKEN — the API
      # refuses to start in production without auth credentials.
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8787
      DATABASE_URL: file:/data/proofloop.db
      PROOFLOOP_WORKSPACE_ROOT: /data/workspaces
      PROOFLOOP_EVIDENCE_ROOT: /data/evidence
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8787}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      # Auth (optional in development, required in production).
      # PROOFLOOP_API_KEYS accepts "token:orgId" pairs for tenant-scoped keys.
      PROOFLOOP_API_TOKEN: ${PROOFLOOP_API_TOKEN:-}
      PROOFLOOP_API_KEYS: ${PROOFLOOP_API_KEYS:-}
      # GitHub App
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PROOFLOOP_AUTO_REGISTER: ${PROOFLOOP_AUTO_REGISTER:-}
      # GitLab
      GITLAB_URL: ${GITLAB_URL:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET:-}
      # Queue: enabled via the bundled redis service. Remove REDIS_URL to run
      # jobs in-process instead.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Object storage (optional; falls back to local disk)
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - proofloop-data:/data
    ports:
      - "8787:8787"
    depends_on:
      - redis
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - proofloop-redis:/data

volumes:
  proofloop-data:
  proofloop-redis:
