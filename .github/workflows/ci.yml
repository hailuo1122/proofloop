name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Setup demo fixtures
        run: |
          pnpm demo:setup
          pnpm demo:python
        shell: bash

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Dockerfile build (api)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pnpm --filter @proofloop/api deploy --legacy /tmp/pl-api-deploy
          test -f /tmp/pl-api-deploy/dist/index.js
        shell: bash
