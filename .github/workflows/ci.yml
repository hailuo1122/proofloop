name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is read from package.json packageManager field

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm --filter @proofloop/core build && pnpm --filter @proofloop/git build && pnpm --filter @proofloop/security build && pnpm --filter @proofloop/llm build && pnpm --filter @proofloop/analyzers build && pnpm --filter @proofloop/verifiers build && pnpm --filter @proofloop/evidence build

      - name: Setup demo fixtures
        run: |
          pnpm demo:setup
          pnpm demo:python
        shell: bash

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm --filter @proofloop/* test

      - name: Build (full)
        run: pnpm --filter @proofloop/* build

      - name: Dockerfile build (api)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pnpm --filter @proofloop/api deploy --legacy /tmp/pl-api-deploy
          test -f /tmp/pl-api-deploy/dist/index.js
        shell: bash
